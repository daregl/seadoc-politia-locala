<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-label="Arhitectura SeaDoc: browser și agent local, aplicația Node.js, baza de date și fișierele criptate, plus sistemele externe opționale" font-family="IBM Plex Sans, Arial, sans-serif">
  <defs><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14202e"/></marker></defs>
  <rect width="1000" height="600" fill="#ffffff"/>
  <g font-size="13" fill="#4f5b68"><text x="20" y="28">Stația utilizatorului</text><text x="200" y="168">Aplicația SeaDoc, un singur proces Node.js (NestJS)</text><text x="20" y="438">Date</text><text x="740" y="168">Sisteme externe, opționale</text></g>
  <g fill="#14202e"><rect x="20" y="40" width="330" height="76" rx="3"/><rect x="370" y="40" width="330" height="76" rx="3" fill="#ffffff" stroke="#14202e"/></g>
  <text x="185" y="72" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">Browser, desktop sau telefon</text><text x="185" y="96" text-anchor="middle" fill="#c3ccd6" font-size="13">React, TypeScript, bpmn-js. Fără instalare.</text>
  <text x="535" y="72" text-anchor="middle" fill="#14202e" font-size="16" font-weight="600">Agent local de semnare</text><text x="535" y="96" text-anchor="middle" fill="#4f5b68" font-size="13">Doar pentru semnătura cu certificat sau token</text>
  <rect x="20" y="180" width="680" height="230" fill="#f4f5f7" stroke="#a9b1ba" rx="3"/>
  <rect x="40" y="198" width="640" height="52" fill="#ffffff" stroke="#14202e" rx="3"/><text x="360" y="229" text-anchor="middle" fill="#14202e" font-size="15" font-weight="600">API: autentificare, MFA, roluri și permisiuni pe fiecare cerere</text>
  <g fill="#ffffff" stroke="#a9b1ba"><rect x="40" y="266" width="150" height="58" rx="3"/><rect x="203" y="266" width="150" height="58" rx="3"/><rect x="366" y="266" width="150" height="58" rx="3"/><rect x="530" y="266" width="150" height="58" rx="3"/><rect x="40" y="336" width="150" height="58" rx="3"/><rect x="203" y="336" width="150" height="58" rx="3"/><rect x="366" y="336" width="150" height="58" rx="3"/><rect x="530" y="336" width="150" height="58" rx="3"/></g>
  <g font-size="13" fill="#14202e" text-anchor="middle" font-weight="500"><text x="115" y="292">Registratură</text><text x="278" y="292">Motor de fluxuri</text><text x="441" y="292">OCR</text><text x="605" y="292">Semnături</text><text x="115" y="362">Căutare și duplicate</text><text x="278" y="362">Arhivă și retenție</text><text x="441" y="362">Audit și GDPR</text><text x="605" y="362">Notificări</text></g>
  <g font-size="12" fill="#4f5b68" text-anchor="middle"><text x="115" y="311">numerotare anuală</text><text x="278" y="311">BPMN 2.0, propriu</text><text x="441" y="311">tesseract.js, română</text><text x="605" y="311">internă, cu certificat</text><text x="115" y="381">full-text, trigrame</text><text x="278" y="381">nomenclator, termene</text><text x="441" y="381">jurnal în lanț de hash</text><text x="605" y="381">în aplicație, email</text></g>
  <g fill="#ffffff" stroke="#14202e"><rect x="20" y="450" width="330" height="96" rx="3"/><rect x="370" y="450" width="330" height="96" rx="3"/></g>
  <text x="185" y="484" text-anchor="middle" fill="#14202e" font-size="16" font-weight="600">PostgreSQL 16</text><text x="185" y="508" text-anchor="middle" fill="#4f5b68" font-size="13">metadate, fluxuri, text extras, căutare,</text><text x="185" y="526" text-anchor="middle" fill="#4f5b68" font-size="13">jurnal de audit nealterabil</text>
  <text x="535" y="484" text-anchor="middle" fill="#14202e" font-size="16" font-weight="600">Fișiere pe disc</text><text x="535" y="508" text-anchor="middle" fill="#4f5b68" font-size="13">criptate AES-256-GCM,</text><text x="535" y="526" text-anchor="middle" fill="#4f5b68" font-size="13">backup și restaurare testată</text>
  <g fill="#ffffff" stroke="#76818d" stroke-dasharray="5 4"><rect x="740" y="180" width="240" height="50" rx="3"/><rect x="740" y="240" width="240" height="50" rx="3"/><rect x="740" y="300" width="240" height="50" rx="3"/><rect x="740" y="360" width="240" height="50" rx="3"/></g>
  <g font-size="13" fill="#14202e" text-anchor="middle"><text x="860" y="210">Active Directory / LDAP</text><text x="860" y="270">SSO prin OIDC</text><text x="860" y="330">Server de email: SMTP, IMAP</text><text x="860" y="390">Nexus ERP: import din fișier CSV</text></g>
  <g stroke="#14202e" stroke-width="1.5" fill="none"><path d="M185 116V180" marker-end="url(#s)" marker-start="url(#s)"/><path d="M535 116V180" marker-end="url(#s)" stroke-dasharray="5 4"/><path d="M185 410V450" marker-end="url(#s)" marker-start="url(#s)"/><path d="M535 410V450" marker-end="url(#s)" marker-start="url(#s)"/><path d="M700 295H740" marker-end="url(#s)" marker-start="url(#s)" stroke-dasharray="5 4"/></g>
  <text x="20" y="582" font-size="12.5" fill="#4f5b68">Linie punctată: componente care funcționează doar după configurare. Toate rulează pe un singur server.</text>
</svg>
