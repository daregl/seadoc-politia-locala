# Livrare pe un singur server. Secretele vin din .env (vezi .env.example).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: seadoc
      POSTGRES_DB: seadoc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?setati POSTGRES_PASSWORD}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seadoc"]
      interval: 5s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://seadoc:${POSTGRES_PASSWORD}@db:5432/seadoc
      HOST: 0.0.0.0
      STORAGE_DIR: /data/files
    ports:
      - "127.0.0.1:4100:4100"
    volumes:
      - files:/data
volumes:
  db:
  files:
